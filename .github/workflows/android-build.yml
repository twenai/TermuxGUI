name: Android Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (ABI splits + universal)
        run: gradle :app:assembleDebug --no-daemon

      - name: List APK outputs
        run: |
          echo "APK generated:"
          find app/build/outputs/apk/debug -name "*.apk" -print | sort

      # Upload per-ABI (tidak digabung) agar user langsung pilih sesuai perangkat
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: termuxgui-debug-arm64-v8a
          path: app/build/outputs/apk/debug/*arm64-v8a-debug.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: termuxgui-debug-armeabi-v7a
          path: app/build/outputs/apk/debug/*armeabi-v7a-debug.apk

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: termuxgui-debug-x86
          path: app/build/outputs/apk/debug/*x86-debug.apk

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: termuxgui-debug-x86_64
          path: app/build/outputs/apk/debug/*x86_64-debug.apk

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: termuxgui-debug-universal
          path: app/build/outputs/apk/debug/*universal-debug.apk

      - name: Build summary (langsung pilih APK sesuai perangkat)
        run: |
          {
            echo "## 📦 TermuxGUI APK Build Result"
            echo
            echo "Silakan **langsung pilih artifact** sesuai perangkat Anda (tidak digabung):"
            echo
            echo "- **termuxgui-debug-arm64-v8a** → Android 64-bit ARM (mayoritas HP modern)"
            echo "- **termuxgui-debug-armeabi-v7a** → Android 32-bit ARM"
            echo "- **termuxgui-debug-x86** → Intel/Emulator 32-bit"
            echo "- **termuxgui-debug-x86_64** → Intel/Emulator 64-bit"
            echo "- **termuxgui-debug-universal** → untuk banyak arsitektur (ukuran lebih besar)"
            echo
            echo "### Generated files"
            find app/build/outputs/apk/debug -name "*.apk" -print | sed 's/^/- `/' | sed 's/$/`/' | sort
          } >> "$GITHUB_STEP_SUMMARY"
